[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videocreate"
dynamic = ["version"]
description = "Resumable model-independent video creation for Codex"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
videocreate = "videocreate.cli:main"

[tool.setuptools]
package-dir = {"" = "videocreate/src"}

[tool.setuptools.dynamic]
version = {attr = "videocreate.__version__"}

[tool.setuptools.packages.find]
where = ["videocreate/src"]
