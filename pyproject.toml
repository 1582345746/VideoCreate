[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videocreate"
dynamic = ["version"]
description = "Resumable model-independent video creation for Codex"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
web = ["fastapi==0.128.8", "uvicorn==0.39.0"]

[project.scripts]
videocreate = "videocreate.cli:main"
videocreate-manager = "videocreate.manager:main"
videocreate-config-web = "videocreate.config_web.launcher:main"

[tool.setuptools.package-data]
"videocreate.config_web" = ["static/index.html", "static/assets/*"]

[tool.setuptools]
package-dir = {"" = "videocreate/src"}

[tool.setuptools.dynamic]
version = {attr = "videocreate.__version__"}

[tool.setuptools.packages.find]
where = ["videocreate/src"]
