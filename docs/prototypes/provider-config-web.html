function rows(){return data.models.filter(m=>(page==='catalog'||m.provider===provider)&&(kind==='all'||kind===m.kind)&&(family==='all'||family===m.family)&&(!favorites||m.favorite)&&[m.name,m.remote,m.notes,m.tags,data.providers.find(p=>p.id===m.provider)?.name].join(' ').toLowerCase().includes(query.toLowerCase()))}

function status(m){return m.enabled&&m.protocol!=='unconfigured'?'<span class="pill green"><span class="dot"></span>已配置</span>':'<span class="pill amber">待配置草稿</span>'}
function foot(){return '<footer class="page-foot"><span>所有配置操作都在本机完成 · 视频制作继续在 Codex 中进行</span><span>原型仅使用演示数据，刷新可恢复初始状态</span></footer>'}
function detail(m){if(!m)return '<aside class="panel detail"><div class="empty">选择模型查看详情</div></aside>';const p=data.providers.find(p=>p.id===m.provider);return `<aside class="panel detail" aria-label="模型详情"><div class="detail-top"><div><span class="pill">模型详情</span><h2>${esc(m.name)}</h2><div class="small muted" style="margin-top:5px">${esc(p.name)} · ${esc(m.family)}</div></div><button class="quiet icon-btn" data-favorite="${esc(m.id)}" aria-label="${m.favorite?'取消收藏':'收藏模型'}">${m.favorite?'★':'☆'}</button></div><div><h3>参数概览</h3><dl class="kv"><dt>时长 / 清晰度</dt><dd>${duration(m)} · ${esc(m.res)}</dd><dt>画幅</dt><dd>${esc(m.ratio)}</dd><dt>操作</dt><dd>${m.kind==='image'?'图片生成':m.protocol==='xingapi-video-v1'?'文生视频':'按协议核实'}</dd></dl><div class="tags">${status(m)}<span class="pill blue">${esc(m.evidence)}</span></div></div><div class="detail-block"><h3>参考能力 <span class="pill amber">供应商声明</span></h3><div class="small muted">图片 ${m.images===''?'未知':esc(m.images)} · 视频 ${m.videos===''?'未知':esc(m.videos)} · 音频 ${m.audios===''?'未知':esc(m.audios)}</div><p class="small muted" style="margin-top:8px">数量声明需核对执行协议与混合限制。</p></div><div class="detail-block"><h3>价格</h3><div>${price(m)}</div><p class="small muted" style="margin-top:5px">${m.priceVerified?'预算报价已确认；实付另记':'展示报价，实际账户价格待核实'}</p></div><div class="detail-block"><h3>备注</h3><div class="detail-note">${esc(m.notes||'暂无备注')}</div><div class="tags" style="margin-top:10px">${m.tags.split(/[,，]/).filter(Boolean).map(t=>`<span class="pill">${esc(t.trim())}</span>`).join('')}</div></div><button class="primary" data-edit-model="${esc(m.id)}">编辑模型配置</button></aside>`}
function modelTable(){const list=rows();if(!list.some(m=>m.id===selected))selected=list[0]?.id??'';return `<div class="models-grid"><section class="panel"><div class="table-wrap"><table aria-label="模型列表"><thead><tr><th style="width:30px"><span class="small">选</span></th><th>模型 / 远端名称</th><th>常用参数</th><th>报价</th><th>接入状态</th><th></th></tr></thead><tbody>${list.map(m=>`<tr data-model="${esc(m.id)}" tabindex="0" class="${m.id===selected?'selected':''}"><td><input type="checkbox" data-compare="${esc(m.id)}" aria-label="比较 ${esc(m.name)}" ${compared.has(m.id)?'checked':''}></td><td><div class="model-cell"><span class="model-icon">${m.kind==='image'?'图':esc(m.family.slice(0,1))}</span><div><div class="model-title">${esc(m.name)} ${m.favorite?'<span class="star">★</span>':''}</div><div class="model-id">${esc(m.remote)}</div>${page==='catalog'?`<div class="small muted">${esc(data.providers.find(p=>p.id===m.provider).name)}</div>`:''}</div></div></td><td class="feature">${duration(m)}<br><span class="muted">${esc(m.res)}</span></td><td><div class="price">${price(m)}</div><div class="small muted">${m.priceVerified?'预算价已确认':'待核实'}</div></td><td>${status(m)}</td><td><button class="quiet icon-btn" data-edit-model="${esc(m.id)}" aria-label="编辑 ${esc(m.name)}">↗</button></td></tr>`).join('')}</tbody></table>${!list.length?'<div class="empty">没有符合条件的模型<br><button class="quiet" data-clear-filters>清除筛选</button></div>':''}</div><div class="table-footer"><span>共 ${list.length} 个模型 · 可选中比较</span><span>声明与实测分别记录</span></div></section>${detail(data.models.find(m=>m.id===selected))}</div>`}
function modelPage(){const p=data.providers.find(p=>p.id===provider),all=page==='catalog';main.innerHTML=`<div class="page-heading"><div><div class="row" style="gap:8px;margin-bottom:8px"><span class="small muted">${all?'跨上游查看与比较':'服务与模型配置'}</span>${!all?'<span class="pill green">本机保存</span>':''}</div><h1>${all?'模型目录':esc(p.name)}</h1><p class="caption">${all?'按模型查找不同上游，备注、参数和价格一目了然。':'管理这家服务的模型、参考能力与价格。'}</p></div><div class="row">${!all?`<button data-edit-provider="${esc(p.id)}">编辑上游</button>`:''}<button class="primary" data-add-model>＋ 添加模型</button></div></div>${!all?`<section class="summary"><div class="summary-data"><div class="summary-item"><label>API 地址</label><span class="mono">${esc(p.url)}</span></div><div class="summary-item"><label>API 密钥</label><span>${p.credential?'••••••••　<span style="color:var(--accent)">已配置</span>':'<span style="color:var(--amber)">尚未配置</span>'}</span></div><div class="summary-item"><label>模型</label><span>${data.models.filter(m=>m.provider===p.id).length} 个接入</span></div></div><button data-check="${esc(p.id)}">检查连接与目录</button></section>`:''}<div class="section-heading"><div><h2>${all?'全部模型':'已添加模型'}</h2><p class="caption">${all?'同名型号在不同上游下独立管理。':'从目录导入后，先补齐配置再启用。'}</p></div><div class="row"><button id="compare-button" ${compared.size<2?'disabled':''}>比较所选${compared.size?' ('+compared.size+')':''}</button>${!all?'<button data-import>从目录导入</button>':''}</div></div><div class="toolbar"><div class="search"><svg viewBox="0 0 20 20"><circle cx="8" cy="8" r="5.5"/><path d="m12 12 5 5"/></svg><input id="search" placeholder="搜索模型名称、备注或标签…" aria-label="搜索模型" value="${esc(query)}"></div><select id="kind" aria-label="媒体类型"><option value="all">全部类型</option><option value="video">视频</option><option value="image">图片</option></select><select id="family" aria-label="模型家族"><option value="all">全部家族</option>${[...new Set(data.models.map(m=>m.family))].map(f=>`<option>${esc(f)}</option>`).join('')}</select><button id="favorites" class="${favorites?'primary':''}" aria-pressed="${favorites}">☆ 收藏</button></div><div id="models-region">${modelTable()}</div>${foot()}`;$('#kind').value=kind;$('#family').value=family}
function defaultsPage(){main.innerHTML=`<div class="page-heading"><div><h1>默认选择</h1><p class="caption">图片与视频分别设置。只影响以后尚未创建的新任务。</p></div></div><div class="cards">${['video','image'].map(k=>`<section class="panel settings-card"><span class="pill">${k==='video'?'视频':'图片'}</span><h2 style="margin-top:13px">${k==='video'?'视频模型':'图片模型'}</h2><p class="caption">在 Codex 没有指定组合时，如何选择。</p><label for="default-${k}">推荐组合</label><select id="default-${k}">${data.models.filter(m=>m.kind===k&&m.enabled&&m.protocol!=='unconfigured').map(m=>`<option value="${esc(m.id)}" ${data.defaults[k]===m.id?'selected':''}>${esc(data.providers.find(p=>p.id===m.provider).name)} / ${esc(m.name)}</option>`).join('')}</select><label class="choice"><input type="radio" name="policy-${k}" value="ask" ${data.defaults[k+'Policy']==='ask'?'checked':''}><div><strong>先在 Codex 列出选项</strong><p class="caption">该组合仅作为推荐，回复编号后再使用。</p></div></label><label class="choice"><input type="radio" name="policy-${k}" value="use-default" ${data.defaults[k+'Policy']==='use-default'?'checked':''}><div><strong>直接沿用推荐组合</strong><p class="caption">仍按当前请求、协议及授权范围检查。</p></div></label></section>`).join('')}</div><div class="settings-actions"><button class="primary" id="save-defaults">保存默认选择</button></div><div class="notice">已创建任务继续使用原来的上游和账户；更改默认不会迁移或重新创建任务。</div>${foot()}`}
function checksPage(){main.innerHTML=`<div class="page-heading"><div><h1>检查与记录</h1><p class="caption">连接、模型目录与配置变更集中查看。</p></div><button id="diagnostics">预览脱敏诊断</button></div><div class="panel">${data.logs.length?data.logs.map(l=>`<div class="log"><span class="log-icon">✓</span><div class="log-content"><div class="log-title">${esc(l.title)} <span class="pill">演示</span></div><p class="caption">${esc(l.detail)}</p></div><span class="small muted">${esc(l.time)}</span></div>`).join(''):'<div class="empty">暂无演示操作记录<br><span class="small">可先在上游页面检查目录或编辑模型。</span></div>'}</div>${foot()}`}
function settingsPage(){main.innerHTML=`<div class="page-heading"><div><h1>设置</h1><p class="caption">查看配置位置、备份与本机访问设置。</p></div></div><div class="panel settings-card"><h2>配置文件</h2><p class="caption" style="margin-top:7px">正式版由技能和网页共同读取同一份 JSON。</p><div class="explain mono" style="margin-top:18px">%LOCALAPPDATA%/VideoCreate/videocreate.config.json<br><span class="small">原型中的展示路径，不读取实际文件。</span></div><div class="row" style="flex-wrap:wrap"><button data-explain="备份与恢复会先展示差异，并保留旧任务所需上游。此处仅演示入口。">备份与恢复</button><button data-explain="正式版在后端保留配置历史，支持并发冲突提示。此处未接入本机文件。">配置变更历史</button><button id="reset-demo">重置原型数据</button></div></div><div class="cards" style="margin-top:20px"><section class="panel settings-card"><h2>本机访问</h2><dl class="kv"><dt>管理地址</dt><dd class="mono">127.0.0.1:8787</dd><dt>状态</dt><dd>拟议端口 · 尚未启动</dd></dl><p class="caption">正式版使用启动脚本并自动打开浏览器。</p></section><section class="panel settings-card"><h2>素材服务</h2><dl class="kv"><dt>素材端口</dt><dd class="mono">8765</dd><dt>用途</dt><dd>提供参考素材 HTTPS 直链</dd></dl><p class="caption">与上游配置页分别运行，素材操作由 Codex 完成。</p></section></div>${foot()}`}
function render(){nav();if(page==='providers'||page==='catalog')modelPage();else if(page==='defaults')defaultsPage();else if(page==='checks')checksPage();else settingsPage()}
function showModal(title,sub,body,foot,tabs=''){modalDirty=false;modal.innerHTML=`<div class="modal-head"><div><h2 id="modal-title">${title}</h2><p class="caption">${sub}</p></div><button class="quiet icon-btn" data-close aria-label="关闭">✕</button></div>${tabs}<div class="modal-content">${body}</div><div class="modal-foot">${foot}</div>`;modal.showModal()}
function closeModal(){if(modalDirty&&!confirm('放弃当前尚未保存的演示修改？'))return;modal.close();modal.innerHTML='';modalDirty=false}
function field(name,label,value='',hint='',type='text',full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="any"':''}>${hint?`<span class="hint">${hint}</span>`:''}</div>`}
function choose(name,label,value,options,full=false){return `<div class="field ${full?'full':''}"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
function providerForm(id){const p=data.providers.find(p=>p.id===id)||{name:'',url:'',note:'',account:'',credential:false};showModal(id?'编辑上游':'添加上游','只需填写 URL 和 Key，其余接入信息交给 Codex 整理。',`<form id="provider-form" data-id="${esc(id||'')}"><p class="inline-error" role="alert"></p><div class="fields">${field('url','API 地址（URL）',p.url,'完整 API 基址，例如 https://example.com/v1','url',true)}<div class="field full"><label for="f-apiKey">API 密钥（Key）</label><input id="f-apiKey" name="apiKey" type="password" autocomplete="new-password" placeholder="${p.credential?'已配置，留空保留':'粘贴密钥'}"><span class="hint">原型不会保存密钥；正式版由本机后端加密保存。</span></div></div><div class="explain" style="margin-top:20px">模型目录、协议与参数由 Codex 结合只读检查和接入文档匹配。不确定时显示待确认，不用生成请求试协议。此处只演示填写体验，尚未实现自动匹配。</div><details><summary style="cursor:pointer;color:var(--muted);font-size:12px">名称与备注（可选）</summary><div class="fields" style="margin-top:15px">${field('name','显示名称',p.name,'留空使用 API 域名。','text',true)}<div class="field full"><label for="f-note">备注</label><textarea id="f-note" name="note" placeholder="可选：用途或供应商说明…">${esc(p.note)}</textarea></div></div></details></form>`,`<span class="small muted">只保存配置，不发起生成</span><div class="row"><button data-close>取消</button><button class="primary" form="provider-form" type="submit">保存上游</button></div>`);if(id)$('#f-url').readOnly=true}
function modelForm(id){const m=data.models.find(m=>m.id===id)||{provider:provider||data.providers[0].id,name:'',remote:'',family:'Seedance',kind:'video',protocol:'unconfigured',min:'',max:'',res:'',ratio:'',images:'',videos:'',audios:'',price:'',currency:'USD',unit:'次',enabled:false,notes:'',tags:'',doc:'',promptLimit:'',source:'用户录入',sourceDate:''};const tabs=['基本信息','能力与限制','价格','备注与来源','高级设置'];showModal(id?'编辑模型':'添加模型','保存资料草稿，或配置完整后启用。',`<form id="model-form" data-id="${esc(id||'')}"><p class="inline-error" role="alert"></p><section class="form-section" data-section="0"><div class="fields">${field('name','显示名称',m.name,'便于你和 Codex 识别')}${choose('provider','所属上游',m.provider,data.providers.map(p=>[p.id,p.name]))}${field('remote','远端型号',m.remote,'保留 API 返回的准确大小写与连字符。','text',true)}${choose('kind','媒体类型',m.kind,[['video','视频'],['image','图片']])}${choose('family','模型家族',m.family,['Seedance','Grok','Wan','GPT Image','其他'])}</div><label class="checkline"><input name="enabled" type="checkbox" ${m.enabled?'checked':''}>启用该模型</label><p class="hint">启用需要有效协议；未知协议可以先保存为禁用草稿。</p></section><section class="form-section" data-section="1" hidden><div class="explain">供应商声明与执行限制分别保存。这里演示资料填写；不会把“30 图 / 10 视频 / 10 音频”自动转换成已验证能力。</div><div class="fields">${field('min','最短时长（秒）',m.min,'未知留空','number')}${field('max','最长时长（秒）',m.max,'未知留空','number')}${field('res','分辨率',m.res,'例如：720p')}${field('ratio','画幅',m.ratio,'明确列举；“全比例”先保留在备注中')}${field('images','参考图片上限（声明）',m.images,'未知留空','number')}${field('videos','参考视频上限（声明）',m.videos,'未知留空','number')}${field('audios','参考音频上限（声明）',m.audios,'未知留空','number')}${field('promptLimit','提示词上限（字符声明）',m.promptLimit,'计数规则还需核实','number')}</div></section><section class="form-section" data-section="2" hidden><div class="explain">保存展示报价便于比较；账户实付、价格有效期和预算报价在正式版分别记录。</div><div class="fields">${field('price','展示金额',m.price,'未知留空，不按 0 计算','number')}${choose('currency','币种',m.currency,['USD','CNY','未知'])}${choose('unit','计费单位',m.unit,['次','秒','张'])}</div></section><section class="form-section" data-section="3" hidden><div class="fields"><div class="field full"><label for="f-notes">备注</label><textarea id="f-notes" name="notes" rows="5">${esc(m.notes)}</textarea><span class="hint">保留供应商说明和使用经验；备注不会改变接口行为。</span></div>${field('tags','标签',m.tags,'逗号分隔')}${choose('source','来源类型',m.source,['用户录入','供应商说明','API 文档','目录观察'])}${field('doc','文档链接',m.doc,'公开说明地址','url')}${field('sourceDate','记录日期',m.sourceDate,'','date')}</div></section><section class="form-section" data-section="4" hidden><div class="explain">常用接入可从模板选择；特殊协议在这里配置。未知协议不能只靠型号名称推断。</div><div class="fields">${choose('protocol','执行协议',m.protocol,[['unconfigured','尚未配置（草稿）'],['xingapi-video-v1','星光文生视频 v1'],['xingapi-video-v2','星光多媒体参考 v2'],['sub2api-json-v1','Sub2API 视频'],['newapi-json-v1','NewAPI 视频'],['openai-images-v1','兼容图片接口']],true)}</div></section></form>`,`<span class="small muted">保存后供 Codex 读取</span><div class="row"><button data-close>取消</button><button class="primary" form="model-form" type="submit">保存模型</button></div>`,`<div class="tabs" role="tablist">${tabs.map((t,i)=>`<button role="tab" type="button" data-tab="${i}" aria-selected="${i===0}" class="${i===0?'active':''}">${t}</button>`).join('')}</div>`)}
function importModels(){const names=['seedance2.5-V','seedance2.5-s','wan3.0-prime-720P','seedance-933','seedance-2.5-480p-M2'];const existing=data.models.filter(m=>m.provider===provider).map(m=>m.remote);showModal('从目录导入','演示一次目录检查与禁用草稿导入。',`<div class="explain">以下为模拟目录，未发起 API 请求。已添加的型号保留原备注与设置。</div><div id="import-list">${names.map(n=>`<label class="import-row"><input type="checkbox" name="import-remote" value="${esc(n)}" ${existing.includes(n)?'disabled':'checked'}><div><strong style="font-size:13px">${esc(n)}</strong><div class="model-id">远端名称保持原样</div></div><span class="pill ${existing.includes(n)?'':'amber'}">${existing.includes(n)?'已添加':'新增草稿'}</span></label>`).join('')}</div>`,`<span class="small muted">导入后保持禁用，能力待配置</span><div class="row"><button data-close>取消</button><button class="primary" id="confirm-import">导入所选草稿</button></div>`)}
function comparison(){const models=data.models.filter(m=>compared.has(m.id));showModal('模型对比','接入条件与报价并列展示，实际效果请在 Codex 做小样验证。',`<div class="compare-grid">${models.map(m=>`<div class="compare-item"><h3>${esc(m.name)}</h3><p class="caption">${esc(data.providers.find(p=>p.id===m.provider).name)}</p><dl class="kv"><dt>时长</dt><dd>${duration(m)}</dd><dt>清晰度</dt><dd>${esc(m.res)}</dd><dt>报价</dt><dd>${price(m)}</dd><dt>接入</dt><dd>${m.enabled?'已配置':'待配置'}</dd></dl><p class="small muted">${esc(m.evidence)} · ${m.priceVerified?'预算价确认':'报价待核实'}</p></div>`).join('')}</div>`,`<span class="small muted">不同计费单位分别展示，不自动排序推荐</span><button data-close>关闭</button>`)}
function check(id){const p=data.providers.find(p=>p.id===id);notify('正在演示只读目录检查…');setTimeout(()=>{data.logs.unshift({title:p.name+' · 目录检查演示',time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),detail:'模拟返回 5 个型号名称；实际未联网、未读取密钥、未生成。'});notify('演示检查完成：仅显示目录，不代表模型能力通过。');if(page==='checks')render()},500)}
function error(text){const node=$('.inline-error',modal);if(node){node.textContent=text;node.style.display='block';$('.modal-content',modal).scrollTop=0}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){page=b.dataset.page;query='';kind='all';family='all';render();return}
 if(b.dataset.provider){provider=b.dataset.provider;page='providers';query='';kind='all';family='all';render();return}
 if(b.id==='add-provider-side'){providerForm();return}
 if(b.hasAttribute('data-edit-provider')){providerForm(b.dataset.editProvider);return}
 if(b.hasAttribute('data-add-model')){modelForm();return}
 if(b.dataset.editModel){modelForm(b.dataset.editModel);return}
 if(b.dataset.favorite){const m=data.models.find(m=>m.id===b.dataset.favorite);m.favorite=!m.favorite;committed(m.favorite?'已收藏模型':'已取消收藏');render();return}
 if(b.dataset.check){check(b.dataset.check);return}
 if(b.hasAttribute('data-import')){importModels();return}
 if(b.id==='favorites'){favorites=!favorites;render();return}
 if(b.hasAttribute('data-clear-filters')){query='';kind='all';family='all';favorites=false;render();return}
 if(b.id==='compare-button'){comparison();return}
 if(b.hasAttribute('data-close')){closeModal();return}
 if(b.dataset.tab){$$('[data-tab]',modal).forEach(t=>{t.classList.toggle('active',t===b);t.setAttribute('aria-selected',t===b)});$$('[data-section]',modal).forEach(s=>s.hidden=s.dataset.section!==b.dataset.tab);return}
 if(b.id==='save-defaults'){for(const k of ['video','image']){data.defaults[k]=$('#default-'+k).value;data.defaults[k+'Policy']=$(`input[name="policy-${k}"]:checked`).value}committed('默认选择已保存');return}
 if(b.id==='confirm-import'){const items=$$('input[name="import-remote"]:checked',modal);if(!items.length){notify('请先选择新的型号');return}for(const input of items){const remote=input.value;data.models.push({id:'demo-'+Date.now()+'-'+data.models.length,provider,name:remote,remote,family:remote.startsWith('wan')?'Wan':'Seedance',kind:'video',protocol:'unconfigured',min:'',max:'',res:'待核实',ratio:'待核实',images:'',videos:'',audios:'',price:'',currency:'未知',unit:'次',priceVerified:false,enabled:false,favorite:false,notes:'来源：本原型模拟目录。未验证协议、参考与价格。',evidence:'尚未实测',tags:'目录导入',doc:'',promptLimit:'',source:'目录观察',sourceDate:'2026-11-13'})}modalDirty=false;modal.close();committed('已导入 '+items.length+' 个禁用草稿');render();return}
 if(b.id==='diagnostics'){showModal('脱敏诊断预览','演示报告，默认隐藏上游和型号名称。',`<div class="explain">只汇总结构和核实状态，不包含密钥、账户、原始备注或任务链接。</div><pre class="mono" style="white-space:pre-wrap">${esc(JSON.stringify({report_type:'provider-diagnostics-demo',upstreams:data.providers.length,bindings:data.models.length,enabled:data.models.filter(m=>m.enabled).length,network_requests:0,paid_creates:0},null,2))}</pre>`,`<span class="small muted">原型未生成可用于真实诊断的报告</span><button data-close>关闭</button>`);return}
 if(b.id==='reset-demo'){if(confirm('重置所有演示数据？')){data=structuredClone(initial);page='providers';provider='xing';selected='v';query='';kind='all';family='all';favorites=false;compared.clear();$('#saved-status').textContent='示例配置 · 修订 12';render();notify('已恢复初始演示')}return}
 if(b.dataset.explain){notify(b.dataset.explain);return}
});
document.addEventListener('click',e=>{if(e.target.closest('button,input'))return;const row=e.target.closest('[data-model]');if(row){selected=row.dataset.model;$('#models-region').innerHTML=modelTable()}});
document.addEventListener('keydown',e=>{const row=e.target.closest('[data-model]');if(row&&(e.key==='Enter'||e.key===' ')){if(e.target.matches('input,button'))return;e.preventDefault();selected=row.dataset.model;$('#models-region').innerHTML=modelTable()}});
document.addEventListener('input',e=>{if(modal.contains(e.target))modalDirty=true;if(e.target.id==='search'){query=e.target.value;$('#models-region').innerHTML=modelTable()}});
document.addEventListener('change',e=>{if(e.target.id==='kind'||e.target.id==='family'){kind=$('#kind').value;family=$('#family').value;$('#models-region').innerHTML=modelTable()}if(e.target.dataset.compare){if(e.target.checked&&compared.size>=4){e.target.checked=false;notify('最多比较 4 个模型');return}e.target.checked?compared.add(e.target.dataset.compare):compared.delete(e.target.dataset.compare);$('#compare-button').disabled=compared.size<2;$('#compare-button').textContent='比较所选'+(compared.size?' ('+compared.size+')':'')}});
modal.addEventListener('cancel',e=>{e.preventDefault();closeModal()});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,values=Object.fromEntries(new FormData(form));
 if(form.id==='provider-form'){let endpoint;try{endpoint=new URL(values.url);if(endpoint.protocol!=='https:'||endpoint.username||endpoint.password||endpoint.search||endpoint.hash)throw Error()}catch{error('请填写不含密钥、查询或片段的 HTTPS API 地址。');return}const old=data.providers.find(p=>p.id===form.dataset.id);if(!old?.credential&&!values.apiKey.trim()){error('请填写 API 密钥。');return}const identity=old?.id||'provider-'+Date.now(),p={id:identity,name:values.name.trim()||endpoint.hostname,account:old?.account||identity,url:values.url.trim().replace(/\/$/,''),note:values.note,credential:!!values.apiKey||!!old?.credential};if(old)Object.assign(old,p);else data.providers.push(p);provider=p.id;page='providers';$('#f-apiKey').value='';modalDirty=false;modal.close();committed('上游已保存');render();return}
 if(form.id==='model-form'){if(!values.name.trim()||!values.remote.trim()){error('请填写显示名称与准确远端型号。');return}for(const k of ['min','max','images','videos','audios','promptLimit','price']){if(values[k]!==''&&(!Number.isFinite(Number(values[k]))||Number(values[k])<0)){error('时长、数量和价格必须是有限的非负数字。');return}}if(values.min!==''&&values.max!==''&&Number(values.min)>Number(values.max)){error('最短时长不能大于最长时长。');return}if(values.enabled&&values.protocol==='unconfigured'){error('启用模型前请选择执行协议，或取消启用后保存为草稿。');return}const old=data.models.find(m=>m.id===form.dataset.id),m={...old,...values,id:old?.id||'model-'+Date.now(),enabled:!!values.enabled,favorite:old?.favorite||false,priceVerified:old?.priceVerified||false,evidence:old?.evidence||'尚未实测'};delete m.apiKey;if(old)Object.assign(old,m);else data.models.push(m);selected=m.id;provider=m.provider;modalDirty=false;modal.close();committed('模型配置已保存');render()}
});
window.__VC_DEMO={get state(){return structuredClone(data)},reset(){clearTimeout(toastTimer);$('#toast').hidden=true;$('#toast').textContent='';$('#saved-status').textContent='示例配置 · 修订 12';data=structuredClone(initial);page='providers';provider='xing';selected='v';query='';kind='all';family='all';favorites=false;compared.clear();render()}};
render();
})();
</script>
</body>
